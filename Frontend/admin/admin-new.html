<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin-new.css">
  <title>Admin Add Product</title>
</head>
<body>
  <div class="add-product-page">
    <div class="add-product-card">
      <a class="back" href="admin.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 19-7-7 7-7"/>
          <path d="M19 12H5"/>
        </svg>
      </a>
      <form id="add-product-form">
        <div class="product-input">
          <label for="name"><span class="required">*</span> Product Name</label>
          <input type="text" name="name" id="name">
        </div>
        <div class="product-input">
          <label for="price"><span class="required">*</span> Price</label>
          <input type="number" name="price" id="price">
        </div>
        <div class="product-input">
          <label for=""><span class="required">*</span> Tier</label>
          <select name="tier" id="tier-select">
            <option value="0">Select Tier</option>
            <option value="1">Standard</option>
            <option value="2">Plus</option>
            <option value="3">Gold</option>
          </select>
        </div>

        <div class="product-input file-input">
          <label for="front-url"><span class="required">*</span> Front Picture</label>
          <label class="file-label" for="front-url">
            <span class="file-button">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                <circle cx="9" cy="9" r="2"/>
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
              </svg>
            </span>
            <span class="file-name" id="front-url-name">No file chosen</span>
          </label>
          <input type="file" name="front-url" id="front-url" accept="image/png, image/jpeg, image/webp">
        </div> 
        
        <div class="product-input file-input">
          <label for="back-url"><span class="required">*</span> Back Picture</label>
          <label class="file-label" for="back-url">
            <span class="file-button">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                <circle cx="9" cy="9" r="2"/>
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
              </svg>
            </span>
            <span class="file-name" id="back-url-name">No file chosen</span>
          </label>
          <input type="file" name="back-url" id="back-url" accept="image/png, image/jpeg, image/webp">
        </div>

        <div class="product-input">
          <label for="description">Description</label>
          <textarea name="description" id="description"></textarea>
        </div>

        <button type="submit" id="add-button">Add Product</button>
        <p id="form-message" class="form-message"></p>
      </form>
    </div>
  </div>
  <script type="module" src="../js/admin-new.js"></script>
</body>
</html>
