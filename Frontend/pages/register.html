<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/header.css">
        <link rel="stylesheet" href="../css/register.css">
        <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&icon_names=local_mall,login,logout,person&display=block">
        <title>Register</title>
    </head>
<body>
    <div id="register-box"><img id="register-logo" src="../assets/logo/primary.webp"><h1 id="register-h1">Register</h1></div>

    <form id="register-form">
        <label for="name">Name</label><br>
        <input type="text" id="register-name" name="name" required><br>
        <label for="email">Email</label><br>
        <input type="email" id="register-email" name="email" required><br>
        <label for="password">Password</label><br>
        <input type="password" id="register-password" name="password" required><br>
        <button id="register-btn" type="submit">Register</button>
        <a id="register-login-link" href="login.html">Already have an account? Log in here!</a>
        <p id="error-message" style="color: red;"></p>
    </form>
    <script src="../js/register.js"></script>
</body>

</html>
